[package]
name = "snap24-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "snap24-mcp"
path = "src/main.rs"

[dependencies]
snap24-core = { path = "../snap24-core" }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
